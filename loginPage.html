<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
     body{
        background-image: url(https://media.istockphoto.com/id/1250581414/photo/blue-double-exposure-of-money-coins-stacking-with-bar-graph-for-financial-and-investment.jpg?s=612x612&w=0&k=20&c=tjDzpMnVSMO2RGzt0GNwL7ccmkJytRaKsco4HzB1X5k=);
        text-align: center;
     }
     body{
        background-size: cover;
        background-repeat: no-repeat;
     }
     form{
            background-color: #fff;
            max-width: 500px;
            margin: 50px auto;
            padding : 30px 20px;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.5);
        }
        .form-control input,
        .form-control select,
        .form-control textarea{
            border: 1px solid #777;
            border-radius: 2px;
            font-family: inherit;
            padding: 10px;
            display: block;
            width: 95%;
        }
         .form-control {
            text-align: left;
            margin-bottom: 25px;
        }
         button {
            background-color: rgb(97, 184, 212);
            border: 1px solid #777;
            border-radius: 5px;
            font-family: inherit;
            font-size: 21px;
            display: block;
            width: 100%;
            margin-top: 50px;
            margin-bottom: 20px;
        }


    </style>
</head>
<body>
    <h1> Login here!!</h1>
   <form action="">
    <div class="form-control">
    <label for="first">Username:</label>
    <input type="text" id="first" name="first" placeholder="Enter your Username" required>
    </div>
    <div class="form-control">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your Password" required>
    </div><div class="form-control">
    <button type="submit" value="submit">
        Login
    </button> 
    </div>
</form> 
</body>
</html>
